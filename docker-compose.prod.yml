# Production Docker Compose Configuration
# Usage: docker-compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-supersecret}
      - POSTGRES_DB=${POSTGRES_DB:-autorepair}
    networks:
      - autorepair_net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    volumes:
      - uploads_data:/app/uploads
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-supersecret}@db:5432/${POSTGRES_DB:-autorepair}
      - JWT_SECRET=${JWT_SECRET:-YOUR_PRODUCTION_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - API_V1_STR=/api/v1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - autorepair_net
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    networks:
      - autorepair_net
    restart: always

networks:
  autorepair_net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
